services:
  backend:
    build: .
    container_name: application-container
    environment:
      -  CONN_STRING_DOCKER=postgres://postgres:pass@postgres:5432/postgres?sslmode=disable
    ports:
      - "5000:5000"
  postgres:
    image: postgres:18-bookworm
    container_name: database-container
    environment:
      - POSTGRES_PASSWORD=pass
    ports:
      - "5432:5432"
